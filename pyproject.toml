[project]
name = "isla-lean"
version = "0.1.0"
description = "Lift RISC-V machine code through Isla footprints of the Sail model into provable Lean"
readme = "README.md"
authors = [
    { name = "Philip Zucker", email = "philzook58@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
isla-lean = "isla_lean.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
